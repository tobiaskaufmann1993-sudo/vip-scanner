name: Scan and publish MezaVPN subscription

on:
  schedule:
    # Four opportunities per hour compensate for GitHub occasionally delaying
    # a scheduled event. The gate below permits a full scan only every ~30 min.
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: meza-vip-scanner-pages
  cancel-in-progress: false

env:
  XRAY_VERSION: "v26.3.27"
  # Public feeds can be tracked here; private feeds remain in the SUB_URLS secret.
  ADDITIONAL_SUB_URLS: "https://raw.githubusercontent.com/MahsaNetConfigTopic/config/refs/heads/main/xray_final.txt"
  # Broad health filter only; the client performs final regional selection.
  ELITE_LATENCY_MS: "800"
  MAX_LATENCY_MS: "3000"
  MAX_JITTER_MS: "600"
  MAX_OUTPUT: "450"
  MAX_CONFIGS: "1800"
  SCAN_WORKERS: "20"
  # Streaming tests are deliberately bounded to protect GitHub and the public
  # test endpoint while still validating every currently viable candidate.
  SPEED_WORKERS: "8"
  SPEED_TEST_MAX: "450"
  SPEED_TEST_BYTES: "262144"
  STREAM_TEST_BYTES: "1048576"
  SPEED_BUDGET_BYTES: "100663296"
  # Reserve part of the same 96 MiB cap for an independent OVH retry.
  SPEED_RETRY_RESERVE_BYTES: "12582912"
  SPEED_RETRY_URL: "https://proof.ovh.net/files/1Mb.dat"
  MIN_SPEED_MBPS: "1.1"
  GOOD_SPEED_MBPS: "1.5"
  STRONG_SPEED_MBPS: "2.5"
  STREAM_LOW_SPEED_SECONDS: "3"
  STREAM_HISTORY_SCANS: "6"
  GRACE_SCANS: "1"
  GRACE_MAX_AGE_MINUTES: "120"
  MAX_SCAN_SECONDS: "2220"
  OUTPUT_FORMAT: "base64"

jobs:
  freshness:
    name: Check whether a scan is due
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check published result age
        id: check
        shell: bash
        env:
          STATUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/status.json
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run requested: starting a full scan."
            exit 0
          fi

          status_file="$(mktemp)"
          if ! curl --fail --silent --show-error --location \
            --retry 2 --max-time 12 -H 'Cache-Control: no-cache' \
            -o "$status_file" "${STATUS_URL}?check=${GITHUB_RUN_ID}"; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Previous status is unavailable: starting a full scan."
            exit 0
          fi

          age_seconds="$(python -c '
          import datetime as dt, json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
              stamp = dt.datetime.fromisoformat(data["generated_at"].replace("Z", "+00:00"))
              print(max(0, int((dt.datetime.now(dt.timezone.utc) - stamp).total_seconds())))
          except Exception:
              print(999999)
          ' "$status_file")"

          if (( age_seconds >= 1500 )); then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Published result is ${age_seconds}s old: starting a full scan."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Published result is ${age_seconds}s old: no scan needed yet."
          fi

  scan:
    name: Validate, rank and build subscription
    needs: freshness
    if: needs.freshness.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run parser tests
        run: python -m unittest discover -s tests -v

      - name: Download and verify Xray-core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/xray
          base="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/xray.zip "${base}/Xray-linux-64.zip"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/xray.zip.dgst "${base}/Xray-linux-64.zip.dgst"

          expected="$(awk -F '= ' '/256=/ {print $2; exit}' /tmp/xray.zip.dgst | tr -d '\r[:space:]')"
          actual="$(sha256sum /tmp/xray.zip | awk '{print $1}')"
          if [[ -z "${expected}" || "${expected,,}" != "${actual,,}" ]]; then
            echo "Xray checksum verification failed."
            exit 1
          fi

          unzip -q /tmp/xray.zip -d .tools/xray
          chmod +x .tools/xray/xray
          .tools/xray/xray version

      - name: Validate generated configs with Xray
        run: python tests/validate_xray_configs.py .tools/xray/xray

      - name: Build public subscription files
        env:
          SUB_URLS: ${{ secrets.SUB_URLS }}
          PREVIOUS_STATE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/state.json
        run: |
          set -euo pipefail
          rm -rf public
          python scanner.py \
            --xray .tools/xray/xray \
            --output-dir public \
            --previous-state-url "$PREVIOUS_STATE_URL"
          cat public/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish subscription mirror to ArvanCloud
        id: arvan_upload
        continue-on-error: true
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARVAN_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_PAGER: ""
          ARVAN_BUCKET: ${{ secrets.ARVAN_BUCKET }}
          ARVAN_ENDPOINT: ${{ secrets.ARVAN_ENDPOINT }}
          ARVAN_REGION: ${{ secrets.ARVAN_REGION }}
          ARVAN_PUBLIC_BASE_URL: ${{ secrets.ARVAN_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail

          required=(
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY ARVAN_BUCKET
            ARVAN_ENDPOINT ARVAN_REGION
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "ArvanCloud mirror is not configured; missing: ${missing[*]}"
            echo "- ArvanCloud mirror: not configured" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ ! "$ARVAN_ENDPOINT" =~ ^https://[A-Za-z0-9.-]+/?$ ]]; then
            echo "ARVAN_ENDPOINT must be an HTTPS S3 endpoint." >&2
            exit 1
          fi
          if [[ ! "$ARVAN_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "ARVAN_BUCKET has an invalid S3 bucket name." >&2
            exit 1
          fi
          if [[ ! "$ARVAN_REGION" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "ARVAN_REGION is invalid." >&2
            exit 1
          fi

          if ! command -v aws >/dev/null 2>&1; then
            python -m pip install --disable-pip-version-check --quiet awscli
          fi

          aws_args=(
            --endpoint-url "${ARVAN_ENDPOINT%/}"
            --region "$ARVAN_REGION"
          )
          upload_args=(
            --acl public-read
            --cache-control "no-cache, no-store, must-revalidate"
            --only-show-errors
            --no-progress
          )

          # Upload auxiliary files first. sub.txt is uploaded last so the app's
          # primary URL switches only after the matching diagnostics exist.
          aws "${aws_args[@]}" s3 cp public/sub-raw.txt \
            "s3://${ARVAN_BUCKET}/sub-raw.txt" \
            --content-type "text/plain; charset=utf-8" "${upload_args[@]}"
          aws "${aws_args[@]}" s3 cp public/sub-base64.txt \
            "s3://${ARVAN_BUCKET}/sub-base64.txt" \
            --content-type "text/plain; charset=us-ascii" "${upload_args[@]}"
          aws "${aws_args[@]}" s3 cp public/status.json \
            "s3://${ARVAN_BUCKET}/status.json" \
            --content-type "application/json; charset=utf-8" "${upload_args[@]}"
          aws "${aws_args[@]}" s3 cp public/sub.txt \
            "s3://${ARVAN_BUCKET}/sub.txt" \
            --content-type "text/plain; charset=us-ascii" "${upload_args[@]}"

          # Authenticated verification proves that the final object exists and
          # has exactly the same byte length as the freshly generated file.
          remote_size="$(aws "${aws_args[@]}" s3api head-object \
            --bucket "$ARVAN_BUCKET" --key sub.txt \
            --query ContentLength --output text)"
          local_size="$(wc -c < public/sub.txt | tr -d '[:space:]')"
          if [[ "$remote_size" != "$local_size" ]]; then
            echo "ArvanCloud verification failed: local=${local_size}, remote=${remote_size}" >&2
            exit 1
          fi

          if [[ -n "$ARVAN_PUBLIC_BASE_URL" ]]; then
            public_url="${ARVAN_PUBLIC_BASE_URL%/}/sub.txt"
            curl --fail --silent --show-error --location \
              --retry 3 --max-time 20 \
              -H 'Cache-Control: no-cache' \
              -o /tmp/arvan-sub.txt "${public_url}?verify=${GITHUB_RUN_ID}"
            cmp --silent public/sub.txt /tmp/arvan-sub.txt
            echo "- ArvanCloud mirror: uploaded and publicly verified" >> "$GITHUB_STEP_SUMMARY"
            echo "- ArvanCloud URL: ${public_url}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ArvanCloud mirror: uploaded and authenticated verification passed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report ArvanCloud mirror failure
        if: steps.arvan_upload.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::ArvanCloud mirror upload failed; GitHub Pages publishing will continue."
          echo "- ArvanCloud mirror: upload failed (GitHub Pages continued)" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy stable subscription URL
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
