name: Keep scheduled workflows active

on:
  schedule:
    # Public-repository schedules may be disabled after 60 days without repository activity.
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Record monthly repository activity
        shell: bash
        run: |
          set -euo pipefail
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-activity.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-activity.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: keep scheduled scanner active"
          git push
