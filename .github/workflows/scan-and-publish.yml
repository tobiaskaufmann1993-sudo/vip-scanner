name: Scan and publish MezaVPN subscription

on:
  schedule:
    # Four opportunities per hour compensate for GitHub occasionally delaying
    # a scheduled event. The gate below permits a full scan only every ~30 min.
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: meza-vip-scanner-pages
  cancel-in-progress: false

env:
  XRAY_VERSION: "v26.3.27"
  # Broad health filter only; the client performs final regional selection.
  ELITE_LATENCY_MS: "800"
  MAX_LATENCY_MS: "3000"
  MAX_JITTER_MS: "600"
  MAX_OUTPUT: "450"
  MAX_CONFIGS: "1800"
  SCAN_WORKERS: "20"
  SPEED_WORKERS: "12"
  SPEED_TEST_MAX: "450"
  SPEED_TEST_BYTES: "262144"
  MIN_SPEED_MBPS: "0.5"
  GRACE_SCANS: "1"
  GRACE_MAX_AGE_MINUTES: "120"
  MAX_SCAN_SECONDS: "2220"
  OUTPUT_FORMAT: "base64"

jobs:
  freshness:
    name: Check whether a scan is due
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check published result age
        id: check
        shell: bash
        env:
          STATUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/status.json
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run requested: starting a full scan."
            exit 0
          fi

          status_file="$(mktemp)"
          if ! curl --fail --silent --show-error --location \
            --retry 2 --max-time 12 -H 'Cache-Control: no-cache' \
            -o "$status_file" "${STATUS_URL}?check=${GITHUB_RUN_ID}"; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Previous status is unavailable: starting a full scan."
            exit 0
          fi

          age_seconds="$(python -c '
          import datetime as dt, json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
              stamp = dt.datetime.fromisoformat(data["generated_at"].replace("Z", "+00:00"))
              print(max(0, int((dt.datetime.now(dt.timezone.utc) - stamp).total_seconds())))
          except Exception:
              print(999999)
          ' "$status_file")"

          if (( age_seconds >= 1500 )); then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Published result is ${age_seconds}s old: starting a full scan."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Published result is ${age_seconds}s old: no scan needed yet."
          fi

  scan:
    name: Validate, rank and build subscription
    needs: freshness
    if: needs.freshness.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run parser tests
        run: python -m unittest discover -s tests -v

      - name: Download and verify Xray-core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/xray
          base="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/xray.zip "${base}/Xray-linux-64.zip"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/xray.zip.dgst "${base}/Xray-linux-64.zip.dgst"

          expected="$(awk -F '= ' '/256=/ {print $2; exit}' /tmp/xray.zip.dgst | tr -d '\r[:space:]')"
          actual="$(sha256sum /tmp/xray.zip | awk '{print $1}')"
          if [[ -z "${expected}" || "${expected,,}" != "${actual,,}" ]]; then
            echo "Xray checksum verification failed."
            exit 1
          fi

          unzip -q /tmp/xray.zip -d .tools/xray
          chmod +x .tools/xray/xray
          .tools/xray/xray version

      - name: Validate generated configs with Xray
        run: python tests/validate_xray_configs.py .tools/xray/xray

      - name: Build public subscription files
        env:
          SUB_URLS: ${{ secrets.SUB_URLS }}
          PREVIOUS_STATE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/state.json
        run: |
          set -euo pipefail
          rm -rf public
          python scanner.py \
            --xray .tools/xray/xray \
            --output-dir public \
            --previous-state-url "$PREVIOUS_STATE_URL"
          cat public/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy stable subscription URL
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
